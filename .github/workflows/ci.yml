name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      SEED_ADMIN_EMAIL: ci@benaya.test
      SEED_ADMIN_PASSWORD: ci-only-password
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # build pre-renders pages from the CMS, so it needs a seeded (SQLite) database
      - run: pnpm seed
      - run: pnpm build
